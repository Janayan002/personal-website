<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Glitter</title>
<style>
  :root {
    --bg:#0f1115; --panel:#181b21; --line:#2a2e37;
    --ink:#e8e6df; --muted:#8a8f9a; --accent:#d9d24a;
  }
  html, body { margin:0; }

  #app {
    background:var(--bg); color:var(--ink); font-family:'Courier New',monospace;
    min-height:100vh; padding:24px; box-sizing:border-box;
  }
  .wrap { max-width:900px; margin:0 auto; }

  .titlebar { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .titlebar h1 { font-size:20px; letter-spacing:2px; text-transform:uppercase; margin:0; }
  .tagline { color:var(--muted); font-size:12px; }
  .blurb { color:var(--muted); font-size:13px; margin:0 0 18px; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .btn {
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:8px 14px; cursor:pointer; font:inherit; font-size:12px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .btn:hover { border-color:var(--accent); }

  .seg { display:inline-flex; }
  .seg .btn + .btn { border-left:none; }
  .seg-on { color:var(--accent); border-color:var(--accent); }
  .filename { color:var(--muted); font-size:12px; }

  #fileInput { display:none; }

  /* Sized from the canvas's own pixel dimensions, so it keeps the source
     image's ratio; max-* only ever scales it down, never distorts it. */
  #canvas {
    width:auto; height:auto; max-width:100%; max-height:75vh; background:#000;
    border:1px solid var(--line); image-rendering:pixelated;
    display:block; margin:0 auto;
  }

  .controls {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px; margin-top:20px;
  }
  .controls label {
    font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px;
  }
  .controls input[type=range] { width:100%; accent-color:var(--accent); }
</style>
</head>
<body>

<div id="app">
  <div class="wrap">
    <div class="titlebar">
      <h1>Pixel Glitter</h1>
      <span class="tagline">shake &amp; sparkle any image</span>
    </div>
    <p class="blurb">Upload a photo → it gets sampled down into a colored pixel grid → pixels jitter and flicker like static/glitter.</p>

    <div class="toolbar">
      <label class="btn">
        Choose Image
        <input id="fileInput" type="file" accept="image/*">
      </label>
      <span class="seg" role="group" aria-label="Render mode">
        <button type="button" id="modePixel" class="btn seg-on" aria-pressed="true">Pixel</button>
        <button type="button" id="modeBitmap" class="btn" aria-pressed="false">Bitmap</button>
      </span>
      <button type="button" id="playBtn" class="btn">Pause</button>
      <button type="button" id="downloadBtn" class="btn">Save PNG frame</button>
      <span id="fileName" class="filename"></span>
    </div>

    <canvas id="canvas" width="1000" height="1000"></canvas>

    <div class="controls">
      <div>
        <label for="resSlider">Grid resolution: <span id="resVal"></span>px</label>
        <input id="resSlider" type="range" min="10" max="500" value="160">
      </div>
      <div>
        <label for="shakeSlider">Shake strength: <span id="shakeVal"></span></label>
        <input id="shakeSlider" type="range" min="0" max="10" value="3">
      </div>
      <div>
        <label for="glitterSlider">Glitter rate: <span id="glitterVal"></span>%</label>
        <input id="glitterSlider" type="range" min="0" max="60" value="18">
      </div>
      <div>
        <label for="gapSlider"><span id="gapLabel">Pixel gap</span>: <span id="gapVal"></span></label>
        <input id="gapSlider" type="range" min="0" max="6" value="1">
      </div>
      <div>
        <label for="brightSlider">Brightness: <span id="brightVal"></span>%</label>
        <input id="brightSlider" type="range" min="20" max="300" value="100">
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // Long side is 1000px so the top grid res (500) still gets 2px cells; below
  // ~2px, cells collide under rounding and `gap` stops being expressible.
  const MAX_SIZE = 1000;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const sampleCanvas = document.createElement('canvas');
  const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

  // Canvas pixel dims; both the grid and the frame buffer are sized off these.
  let W = MAX_SIZE, H = MAX_SIZE;

  // Frame buffer: we composite the whole grid into one typed array and blit it
  // with a single putImageData, instead of one fillRect per cell.
  let frame, buf32, data8;

  function resizeCanvas(w, h){
    W = w; H = h;
    canvas.width = W;
    canvas.height = H;
    frame = ctx.createImageData(W, H);
    buf32 = new Uint32Array(frame.data.buffer);
    data8 = frame.data;
  }
  resizeCanvas(MAX_SIZE, MAX_SIZE);

  // 0xAABBGGRR on little-endian, 0xRRGGBBAA on big-endian.
  const LITTLE_ENDIAN = (function(){
    const probe = new Uint32Array(1);
    new Uint8Array(probe.buffer)[0] = 1;
    return probe[0] === 1;
  })();
  const BLACK = LITTLE_ENDIAN ? 0xff000000 : 0x000000ff;
  function pack(r, g, b){
    return LITTLE_ENDIAN
      ? (0xff000000 | (b << 16) | (g << 8) | r) >>> 0
      : (((r << 24) | (g << 16) | (b << 8) | 0xff) >>> 0);
  }

  const els = {
    res:     document.getElementById('resSlider'),
    shake:   document.getElementById('shakeSlider'),
    glitter: document.getElementById('glitterSlider'),
    gap:     document.getElementById('gapSlider'),
    bright:  document.getElementById('brightSlider'),
    resVal:     document.getElementById('resVal'),
    shakeVal:   document.getElementById('shakeVal'),
    glitterVal: document.getElementById('glitterVal'),
    gapVal:     document.getElementById('gapVal'),
    gapLabel:   document.getElementById('gapLabel'),
    brightVal:  document.getElementById('brightVal'),
    modePixel:  document.getElementById('modePixel'),
    modeBitmap: document.getElementById('modeBitmap'),
    file:     document.getElementById('fileInput'),
    fileName: document.getElementById('fileName'),
    play:     document.getElementById('playBtn'),
    download: document.getElementById('downloadBtn')
  };

  // Read initial state from the DOM so markup stays the single source of truth.
  let gridRes       = parseInt(els.res.value, 10);
  let shakeStrength = parseInt(els.shake.value, 10);
  let glitterRate   = parseInt(els.glitter.value, 10) / 100;
  let gap           = parseInt(els.gap.value, 10);
  let brightness    = parseInt(els.bright.value, 10) / 100;

  let playing = true;
  let hasImage = false;
  let img = null;

  let mode = 'pixel';     // 'pixel' = square cells, 'bitmap' = halftone dots

  // Grid dims in cells. The slider sets the long side; the short side is
  // derived from the canvas ratio, which keeps cells square-ish.
  let gridW = gridRes, gridH = gridRes;

  // Per-cell data, flat typed arrays sized gridW*gridH.
  let cellR = null, cellG = null, cellB = null;
  let cellLum = null;     // 0..1 luma, sets dot area in bitmap mode
  let cellOpaque = null;  // 1 if source alpha > 0
  let offX = null, offY = null;          // current shake offset, in cells
  let tgtX = null, tgtY = null;          // shake target, in cells
  let alpha = null;                      // current brightness 0..1
  let flicker = null;                    // 1 if cell is in its dim phase

  function updateLabels(){
    els.resVal.textContent = gridRes;
    els.shakeVal.textContent = shakeStrength;
    els.glitterVal.textContent = Math.round(glitterRate * 100);
    els.gapVal.textContent = gap;
    els.brightVal.textContent = Math.round(brightness * 100);
  }
  updateLabels();

  els.res.addEventListener('input', e => {
    gridRes = parseInt(e.target.value, 10);
    updateLabels();
    if (hasImage) sampleImage();
  });
  els.shake.addEventListener('input', e => {
    shakeStrength = parseInt(e.target.value, 10);
    updateLabels();
  });
  els.glitter.addEventListener('input', e => {
    glitterRate = parseInt(e.target.value, 10) / 100;
    updateLabels();
  });
  els.gap.addEventListener('input', e => {
    gap = parseInt(e.target.value, 10);
    updateLabels();
  });
  els.bright.addEventListener('input', e => {
    brightness = parseInt(e.target.value, 10) / 100;
    updateLabels();
  });

  function setMode(next){
    mode = next;
    const isPixel = next === 'pixel';
    els.modePixel.classList.toggle('seg-on', isPixel);
    els.modeBitmap.classList.toggle('seg-on', !isPixel);
    els.modePixel.setAttribute('aria-pressed', String(isPixel));
    els.modeBitmap.setAttribute('aria-pressed', String(!isPixel));
    els.gapLabel.textContent = isPixel ? 'Pixel gap' : 'Dot spacing';
  }
  els.modePixel.addEventListener('click', () => setMode('pixel'));
  els.modeBitmap.addEventListener('click', () => setMode('bitmap'));

  els.play.addEventListener('click', () => {
    playing = !playing;
    els.play.textContent = playing ? 'Pause' : 'Play';
  });

  els.download.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'pixel-glitter-frame.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  els.file.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    els.fileName.textContent = file.name;

    const url = URL.createObjectURL(file);
    const next = new Image();
    next.onload = () => {
      URL.revokeObjectURL(url);
      img = next;
      hasImage = true;
      fitCanvasToImage();
      sampleImage();
    };
    next.onerror = () => {
      URL.revokeObjectURL(url);
      els.fileName.textContent = file.name + ' — could not decode';
    };
    next.src = url;
  });

  // Match the canvas to the source ratio, long side pinned to MAX_SIZE.
  function fitCanvasToImage(){
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) return;
    const scale = MAX_SIZE / Math.max(iw, ih);
    resizeCanvas(
      Math.max(1, Math.round(iw * scale)),
      Math.max(1, Math.round(ih * scale))
    );
  }

  function sampleImage(){
    // Grid follows the canvas ratio, so the whole image fits with no crop.
    if (W >= H){
      gridW = gridRes;
      gridH = Math.max(1, Math.round(gridRes * H / W));
    } else {
      gridH = gridRes;
      gridW = Math.max(1, Math.round(gridRes * W / H));
    }

    sampleCanvas.width = gridW;
    sampleCanvas.height = gridH;
    sampleCtx.clearRect(0, 0, gridW, gridH);
    sampleCtx.drawImage(img, 0, 0, gridW, gridH);

    const src = sampleCtx.getImageData(0, 0, gridW, gridH).data;
    const n = gridW * gridH;

    cellR = new Uint8Array(n);
    cellG = new Uint8Array(n);
    cellB = new Uint8Array(n);
    cellLum = new Float32Array(n);
    cellOpaque = new Uint8Array(n);
    offX = new Float32Array(n);
    offY = new Float32Array(n);
    tgtX = new Float32Array(n);
    tgtY = new Float32Array(n);
    alpha   = new Float32Array(n);
    flicker = new Uint8Array(n);

    for (let i = 0; i < n; i++){
      const idx = i * 4;
      const r = src[idx], g = src[idx + 1], b = src[idx + 2];
      cellR[i] = r; cellG[i] = g; cellB[i] = b;
      // Rec. 709 luma — drives halftone dot area in bitmap mode.
      cellLum[i] = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      cellOpaque[i] = src[idx + 3] > 0 ? 1 : 0;
      alpha[i] = 1;
    }
  }

  function drawPlaceholder(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#3a3f4a';
    ctx.font = '13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('upload an image to begin', W / 2, H / 2);
  }

  // Paint a solid block into the frame buffer, clipped to canvas bounds.
  function block(x0, y0, w, h, packed){
    let xs = x0 < 0 ? 0 : x0;
    let ys = y0 < 0 ? 0 : y0;
    let xe = x0 + w; if (xe > W) xe = W;
    let ye = y0 + h; if (ye > H) ye = H;
    for (let y = ys; y < ye; y++){
      const row = y * W;
      buf32.fill(packed, row + xs, row + xe);
    }
  }

  // Paint an antialiased filled circle. Writes bytes rather than packed
  // words so the edge can blend without endian juggling. Dots are combined
  // with a per-channel max: shake can overlap neighbours, and max keeps the
  // overlap order-independent instead of letting a faint edge punch a dark
  // hole through the dot already there.
  function dot(cx, cy, r, cr, cg, cb){
    if (r <= 0) return;
    let x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
    let y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
    if (x1 > W) x1 = W; if (y1 > H) y1 = H;
    const r2 = r * r;

    for (let y = y0; y < y1; y++){
      const dy = y + 0.5 - cy;
      const dy2 = dy * dy;
      if (dy2 > r2) continue;
      const rowBase = y * W;
      for (let x = x0; x < x1; x++){
        const dx = x + 0.5 - cx;
        const d2 = dx * dx + dy2;
        if (d2 > r2) continue;
        // Feather the last pixel of radius so small dots don't look like plus signs.
        let cov = r - Math.sqrt(d2);
        if (cov > 1) cov = 1;
        else if (cov <= 0) continue;

        const p = (rowBase + x) * 4;
        const nr = cr * cov, ng = cg * cov, nb = cb * cov;
        if (nr > data8[p])     data8[p]     = nr;
        if (ng > data8[p + 1]) data8[p + 1] = ng;
        if (nb > data8[p + 2]) data8[p + 2] = nb;
      }
    }
  }

  function render(){
    requestAnimationFrame(render);

    if (!hasImage || !cellR){
      drawPlaceholder();
      return;
    }

    buf32.fill(BLACK);

    const cellW = W / gridW;
    const cellH = H / gridH;
    // Grid and canvas share a ratio, so these agree to within rounding. The
    // smaller one drives anything that has to stay inside a cell on both axes.
    const cellSize = cellW < cellH ? cellW : cellH;
    // Shake is expressed in cells, so it reads the same at every resolution.
    const shakePx = (shakeStrength / 10) * cellSize * 1.5;
    // Gap is absolute px, so it eats a growing share of the cell as cells
    // shrink: at 2px cells a 1px gap costs 75% of the area (both axes) and
    // just dims the image. Cap it, and drop it once cells are too small to
    // carry a gap at all.
    const effGap = cellSize < 4 ? 0 : Math.min(gap, cellSize * 0.4);
    const gapPx = Math.round(effGap);
    const flipChance = glitterRate * 0.15;
    const sparkChance = glitterRate * 0.03;
    const n = cellR.length;

    const bitmap = mode === 'bitmap';
    const halfW = cellW / 2, halfH = cellH / 2;
    const halfCell = cellSize / 2;
    // Dots touch at full luma; gap pulls them apart. Unlike square cells a
    // gap of 0 is still meaningful here (dots stay round), so gap is scaled
    // to the cell rather than clamped off at small sizes.
    const maxRad = halfCell * (1 - Math.min(gap, 6) / 20);

    for (let i = 0; i < n; i++){
      if (playing){
        // Damped walk toward a re-rolled target: reads as shaking, not static.
        if (Math.random() < 0.12){
          tgtX[i] = (Math.random() - 0.5) * 2 * shakePx;
          tgtY[i] = (Math.random() - 0.5) * 2 * shakePx;
        }
        offX[i] += (tgtX[i] - offX[i]) * 0.35;
        offY[i] += (tgtY[i] - offY[i]) * 0.35;

        if (Math.random() < flipChance) flicker[i] ^= 1;
        alpha[i] = flicker[i]
          ? 0.15 + Math.random() * 0.35   // dim phase
          : 0.85 + Math.random() * 0.15;  // near full, slight sparkle
      }

      if (!cellOpaque[i]) continue;

      const col = i % gridW;
      const row = (i - col) / gridW;
      const ox = offX[i], oy = offY[i];

      // Background is opaque black, so compositing at `alpha` is just a scale.
      const a = alpha[i] * brightness;
      const spark = playing && Math.random() < sparkChance;
      // White spark at 0.5..1 alpha over black == a grey in 128..255.
      const s = spark ? 128 + ((Math.random() * 127) | 0) : 0;
      let r, g, b;
      if (spark){
        r = g = b = s;
      } else {
        const cr = cellR[i], cg = cellG[i], cb = cellB[i];
        let m = cr > cg ? cr : cg; if (cb > m) m = cb;
        // Scale every channel by one shared factor, capped so the hottest
        // channel lands exactly on 255. Clamping channels independently
        // instead would shift hue as brightness rises: (0,255,136) * 2.2
        // clamps to (0,255,255), turning green into cyan. Saturated ink
        // simply stops getting brighter; in bitmap mode the dot keeps
        // growing, which is where the extra tone should come from anyway.
        let f = a;
        if (m * f > 255) f = 255 / m;   // m > 0 whenever this is reachable
        r = (cr * f) | 0; g = (cg * f) | 0; b = (cb * f) | 0;
      }

      if (bitmap){
        // Halftone: dot *area* tracks luma, so radius goes as sqrt — area is
        // what the eye integrates into apparent tone at a distance.
        // Brightness has to reach the radius too, not just the colour: tone
        // here is carried by dot size as much as by ink, so scaling colour
        // alone would leave the dots as small as ever.
        let l = spark ? 1 : cellLum[i] * a;
        if (l > 1) l = 1;
        const rad = maxRad * Math.sqrt(l);
        dot(col * cellW + halfW + ox, row * cellH + halfH + oy,
            rad, r, g, b);
      } else {
        // Size each cell from its own rounded edges rather than a shared
        // rounded width: cellSize is usually fractional (160 -> 6.25), and a
        // constant width leaves whole columns unpainted where the rounding of
        // adjacent starts drifts apart (starts 0,6,13 with width 6 misses px
        // 12). Those unpainted lines are the grid seams. Edge-derived sizes
        // give neighbours a shared boundary, so cells always meet exactly.
        const x = Math.round(col * cellW + ox);
        const y = Math.round(row * cellH + oy);
        let w = Math.round((col + 1) * cellW + ox) - x - gapPx;
        let h = Math.round((row + 1) * cellH + oy) - y - gapPx;
        if (w < 1) w = 1;
        if (h < 1) h = 1;
        block(x, y, w, h, pack(r, g, b));
      }
    }

    ctx.putImageData(frame, 0, 0);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
